# Stack voor Portainer (of Container Manager) op je NAS.
#
# Gebruik:
#   1. Vervang hieronder elke *_PASSWORD/SESSION_SECRET-placeholder door je
#      eigen waarde (zoek ze op met Ctrl+F — sommige komen op 2-3 plekken
#      voor en moeten daar allemaal hetzelfde zijn).
#   2. Plak dit in Portainer: Stacks -> Add stack -> Web editor -> plak ->
#      Deploy the stack.
#   3. Wijs je eigen reverse proxy / Cloudflare Tunnel naar poort 3000 van je
#      NAS (of naar de container "bom-game" als je 'm op hetzelfde
#      Docker-netwerk aansluit).
#
# Updates: geen automatische updater (Watchtower) — na een nieuwe push naar
# main haal je 'm zelf op in Portainer via Stacks -> bom-game -> Pull and
# redeploy.
#
# Zie docs/DEPLOY-SYNOLOGY.md voor de volledige toelichting.

services:
  bom-game:
    image: ghcr.io/rjgout/bom-game:latest
    container_name: bom-game
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://bom:CHANGE_THIS_DB_PASSWORD@bom-db:5432/bom?schema=public
      REDIS_URL: redis://:CHANGE_THIS_REDIS_PASSWORD@bom-redis:6379
      SESSION_SECRET: CHANGE_THIS_TO_A_LONG_RANDOM_STRING
      PORT: 3000
      # Zet tijdelijk op "true" als je test via een plain-http-adres (bv.
      # het LAN-IP van je NAS) — anders blijft inloggen hangen omdat de
      # browser een Secure-cookie negeert zonder https. Weer op "false"
      # zetten (of de regel weghalen) zodra je via je https-domein test.
      ALLOW_INSECURE_COOKIES: "false"
      # Optioneel: alleen nodig als de links in bevestigings-/resetmails niet
      # vanzelf het juiste adres krijgen (zie .env.example). SMTP-instellingen
      # zelf stel je in via /adminbackend in de app, niet hier.
      # APP_URL: "https://bom.jouwdomein.nl"
    depends_on:
      bom-db:
        condition: service_healthy
      bom-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  bom-db:
    image: postgres:16-alpine
    container_name: bom-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bom
      POSTGRES_PASSWORD: CHANGE_THIS_DB_PASSWORD
      POSTGRES_DB: bom
    volumes:
      - /volume1/docker/bom-game/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bom -d bom"]
      interval: 10s
      timeout: 5s
      retries: 5

  bom-redis:
    image: redis:7-alpine
    container_name: bom-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "CHANGE_THIS_REDIS_PASSWORD", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a CHANGE_THIS_REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
