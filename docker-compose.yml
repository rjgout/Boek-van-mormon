# Generieke self-hosting opzet: bouwt de image lokaal uit de broncode en
# start de volledige stack met één commando:
#
#   cp .env.example .env   # eenmalig, vul de waarden in
#   docker compose up -d --build
#
# Zet zelf een reverse proxy (Cloudflare Tunnel, Nginx, Caddy, Traefik, ...)
# voor poort 3000 als je de app publiek bereikbaar wil maken onder je eigen
# domein — deze compose-file is daar bewust neutraal in.
#
# Voor het specifieke geval van een Synology NAS + Cloudflare Tunnel (met
# een vooraf gebouwde image i.p.v. lokaal bouwen, plus automatische updates
# via Watchtower) zie deploy/docker-compose.yml en docs/DEPLOY-SYNOLOGY.md.

services:
  bom-app:
    build: .
    container_name: bom-app
    restart: unless-stopped
    depends_on:
      bom-db:
        condition: service_healthy
      bom-redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-bom}:${POSTGRES_PASSWORD:?Zet POSTGRES_PASSWORD in .env}@bom-db:5432/${POSTGRES_DB:-bom}?schema=public"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Zet REDIS_PASSWORD in .env}@bom-redis:6379"
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  bom-db:
    image: postgres:16-alpine
    container_name: bom-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Zet POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bom}
    volumes:
      - bom_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bom} -d ${POSTGRES_DB:-bom}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bom-redis:
    image: redis:7-alpine
    container_name: bom-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Zet REDIS_PASSWORD in .env}", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Zet REDIS_PASSWORD in .env}

volumes:
  # Persistente data (gebruikers, voortgang, XP, streaks, freezes, vrienden,
  # competitie, spelresultaten, content) staat hier — NIET in de bom-app
  # container. Een container verwijderen en opnieuw starten (zonder deze
  # volume te verwijderen) laat alle data intact.
  bom_db_data:
